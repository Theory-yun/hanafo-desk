<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HANA Family Office | WM RESEARCH DESK</title>
  <!-- 반응형 스타일링을 위한 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              green: '#004B49',
              dark: '#002E2C',
              gold: '#C5A059',
              lightGold: '#F5EFE6'
            }
          },
          fontFamily: {
            sans: ['Pretendard', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- 1. 상단 실시간 티커 바 -->
  <div class="w-full bg-slate-900 border-b border-slate-700 min-h-[46px]">
    <div id="top-ticker-container" class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
    </div>
  </div>

  <!-- 2. 메인 녹색 헤더 -->
  <header class="bg-brand-green text-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
      <div class="flex items-center gap-3">
        <span class="px-2.5 py-1 bg-brand-gold text-brand-dark font-bold text-xs rounded tracking-wider">HANA Family Office</span>
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight">WM RESEARCH DESK</h1>
      </div>
      <div class="flex items-center gap-3 text-sm text-slate-200">
        <!-- 날짜 표시 영역: 스크립트 로딩 전에도 기본 표시되도록 초기값 내장 -->
        <span id="current-date" class="font-medium tracking-wide">기준 : 2026.11.01(SUN)</span>
        <button type="button" onclick="location.reload()" class="px-3 py-1.5 bg-brand-dark hover:bg-opacity-80 border border-brand-gold/40 rounded text-xs text-brand-gold transition">
          데이터 새로고침
        </button>
      </div>
    </div>
  </header>

  <!-- 헤더 직후 날짜 즉시 계산 실행 (하단 코드 영향 받지 않도록 상단 배치) -->
  <script>
    (function() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      const dayOfWeek = days[now.getDay()];
      const dateEl = document.getElementById('current-date');
      if (dateEl) {
        dateEl.textContent = '기준 : ' + year + '.' + month + '.' + day + '(' + dayOfWeek + ')';
      }
    })();
  </script>

  <!-- 2-1. 녹색 바 하단 사이트 메뉴 -->
  <nav class="bg-brand-dark text-slate-200 border-t border-brand-gold/20 shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <ul class="flex items-center gap-1 sm:gap-2 overflow-x-auto no-scrollbar py-2 text-xs sm:text-sm font-medium whitespace-nowrap">
        <li>
          <button type="button" class="px-3.5 py-1.5 rounded-md bg-brand-gold text-brand-dark font-bold transition block">
            종합 대시보드
          </button>
        </li>
        <li>
          <button type="button" class="px-3.5 py-1.5 rounded-md hover:bg-brand-green hover:text-white transition block">
            글로벌 지수·환율
          </button>
        </li>
        <li>
          <button type="button" class="px-3.5 py-1.5 rounded-md hover:bg-brand-green hover:text-white transition block">
            원자재·금리
          </button>
        </li>
        <li>
          <button type="button" class="px-3.5 py-1.5 rounded-md hover:bg-brand-green hover:text-white transition block">
            마켓 뉴스룸
          </button>
        </li>
        <li>
          <button type="button" class="px-3.5 py-1.5 rounded-md hover:bg-brand-green hover:text-white transition block">
            패밀리오피스 인사이트
          </button>
        </li>
      </ul>
